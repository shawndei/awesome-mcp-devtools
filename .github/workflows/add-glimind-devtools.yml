name: Add Glimind devtools entries (one-off)
on:
  push:
    paths:
      - '.github/workflows/add-glimind-devtools.yml'
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Insert Glimind entries into README
        run: |
          python3 - <<'PYEOF'
          import pathlib

          p = pathlib.Path('README.md')
          lines = p.read_text().splitlines()

          entry_action = "- [glimind/check-action](https://github.com/glimind/check-action) \U0001F916 - GitHub Action that audits an MCP server in CI: agent-readiness grade and tool-poisoning scan."
          anchor_action = "- [Booyaka101/mcp-vet](https://github.com/Booyaka101/mcp-vet)"
          toc_entry = "- [Linters & Validators](#linters--validators)"
          section_head = "## Libraries"
          section_block = [
              "## Linters & Validators",
              "",
              "Tools for linting, validating, and checking MCP servers.",
              "",
              "- [Glimind Check](https://glimind.com/check) - Web-based scanner: live reliability, agent-readiness grades and tool-poisoning scans for any public MCP server; no auth required.",
              "",
          ]

          have_action = any(entry_action == ln for ln in lines)
          have_toc = any(toc_entry == ln for ln in lines)
          have_section = any("## Linters & Validators" == ln for ln in lines)

          out = []
          for ln in lines:
              out.append(ln)
              s = ln.strip()
              if not have_action and s.startswith(anchor_action):
                  out.append(entry_action)
                  have_action = True
              elif not have_toc and s == "- [Authorization Testing](#authorization-testing)":
                  out.append(toc_entry)
                  have_toc = True
              elif not have_section and s == section_head:
                  out = out[:-1] + section_block + out[-1:]
                  have_section = True

          missing = [n for n, ok in (("entry", have_action), ("toc", have_toc), ("section", have_section)) if not ok]
          if missing:
              raise SystemExit("missing anchors: " + ", ".join(missing))

          p.write_text("\n".join(out) + "\n")
          print("README updated")
          PYEOF
      - name: Commit and push branch
        run: |
          git config user.name "shawndei"
          git config user.email "shawndei@users.noreply.github.com"
          git checkout -B add-glimind
          git add README.md
          git diff --cached --quiet || git commit -m "Add Glimind entries to Testing Tools and Linters & Validators"
          git push -f origin add-glimind
